<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Lien de paiements — Backoffice Ouvertures Psy</title>
  <link rel="icon" href="/favicon-backoffice.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose: #c9748f; --rose-bg: #fdf0f4; --mauve: #8e6b8e;
      --cream: #faf7f5; --text: #3d2b2b; --muted: #8a7070; --border: #e8d8d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Nunito', sans-serif; background: var(--cream); display: flex; flex-direction: column; }
    header {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 20px; background: white; border-bottom: 1px solid var(--border);
    }
    header a {
      color: var(--mauve); text-decoration: none; font-size: 0.85rem; font-weight: 600;
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    header .titre { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 600; color: var(--mauve); }
    main { flex: 1; position: relative; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    .chargement {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; background: var(--cream); color: var(--muted);
      font-size: 0.85rem;
    }
    .spinner {
      width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--rose);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <a href="/backoffice">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Backoffice
  </a>
  <div class="titre">Lien de paiements</div>
</header>

<main>
  <div class="chargement" id="chargement">
    <div class="spinner"></div>
    Chargement des paiements…
  </div>
  <iframe id="framePaiements" src="https://paiement.meignant.net/" title="Lien de paiements" onload="document.getElementById('chargement').style.display='none'"></iframe>
</main>

</body>
</html>
